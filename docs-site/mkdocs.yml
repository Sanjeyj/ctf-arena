site_name: CTF Arena Documentation
site_url: https://ctfarena.github.io/ctf-arena/
repo_url: https://github.com/Sanjeyj/ctf-arena

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.instant
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Deployment Guide: deployment.md
  - Teams Mode: teams.md
  - REST API: api.md
  - Docker Challenges: docker.md
  - Competition Setup: competition.md
  - Administration: admin.md
  - Security Controls: security.md

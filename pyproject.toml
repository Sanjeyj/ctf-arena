[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfarena"
version = "1.0.0"
description = "Self-hosted CTF platform with native Docker challenge deployments."
readme = "README.md"
authors = [
    { name = "CTF Arena Contributors", email = "contributors@ctf-arena.example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Flask",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "gunicorn>=21.2.0",
    "python-dotenv>=1.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-migrate>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "flask-login>=0.6.3",
    "bcrypt>=4.1.0",
    "flask-wtf>=1.2.1",
    "flask-limiter>=3.5.0",
    "docker>=7.0.0",
]

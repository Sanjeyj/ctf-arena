upstream ctf_arena {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # SSL Certificates (replace with your certificate paths)
    ssl_certificate     /etc/ssl/certs/ctf-arena.crt;
    ssl_certificate_key /etc/ssl/private/ctf-arena.key;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Request limits
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Logging
    access_log /var/log/nginx/ctf-arena-access.log combined;
    error_log  /var/log/nginx/ctf-arena-error.log warn;

    # Static files served directly
    location /static/ {
        alias /opt/ctf-arena/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploads served directly (protected by Flask in production - optional)
    location /uploads/ {
        alias /opt/ctf-arena/uploads/;
        expires 1h;
    }

    # Proxy to Gunicorn
    location / {
        proxy_pass http://ctf_arena;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Rate limit for login endpoints
    location ~ ^/(login|admin/login|register)$ {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://ctf_arena;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block .env and sensitive file access
    location ~* \.(env|git|bak|sql|log)$ {
        deny all;
        return 404;
    }
}

# Define rate limiting zones
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;

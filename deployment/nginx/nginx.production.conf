server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/ssl/ctf-arena/fullchain.pem;
    ssl_certificate_key /etc/ssl/ctf-arena/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern TLS only
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── Client Settings ───────────────────────────────────────────────────────
    client_max_body_size 16M;
    client_body_buffer_size 128k;
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          15s;
    keepalive_timeout     65s;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;
    gzip_min_length   1024;

    # ── Static Assets (served directly by Nginx) ──────────────────────────────
    location /static/ {
        alias /opt/ctf-arena/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /opt/ctf-arena/uploads/;
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
    }

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=60r/m;
    limit_req_zone $binary_remote_addr zone=submit_zone:10m rate=10r/m;

    location /login {
        limit_req zone=login_zone burst=3 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /submit/ {
        limit_req zone=submit_zone burst=5 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://app:8000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── WebSocket (SSE / live updates) ────────────────────────────────────────
    location /stream {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Application (default) ─────────────────────────────────────────────────
    location / {
        proxy_pass http://app:8000;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Health Endpoint (no logs) ─────────────────────────────────────────────
    location /health {
        proxy_pass  http://app:8000;
        access_log  off;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Block sensitive paths ─────────────────────────────────────────────────
    location ~ /\.(env|git|htpasswd|htaccess) {
        deny all;
        return 404;
    }

    location ~* \.(py|cfg|ini|toml|sh|sql)$ {
        deny all;
        return 404;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 404 /404;
    error_page 500 502 503 504 /500;
}

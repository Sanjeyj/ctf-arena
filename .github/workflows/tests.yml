name: CI Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ctf_test
          POSTGRES_USER: ctf_user
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://ctf_user:password123@localhost:5432/ctf_test
        SECRET_KEY: test_secret_key_12345
      run: |
        flask db upgrade

    - name: Run pytest
      env:
        TEST_DATABASE_URL: postgresql://ctf_user:password123@localhost:5432/ctf_test
        SECRET_KEY: test_secret_key_12345
      run: |
        python -m pytest -v

name: Draft Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Step 1: Run Regression Suite as Release Gate ───────────────────────────
  test-gate:
    name: Regression Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ctf_test
          POSTGRES_USER: ctf_user
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      env:
        DATABASE_URL: postgresql://ctf_user:password123@localhost:5432/ctf_test
        SECRET_KEY: release_gate_secret_key_12345
      run: |
        flask db upgrade

    - name: Run regression suite
      env:
        TEST_DATABASE_URL: postgresql://ctf_user:password123@localhost:5432/ctf_test
        SECRET_KEY: release_gate_secret_key_12345
      run: |
        python -m pytest -v

  # ── Step 2: Create Draft Release ──────────────────────────────────────────
  release:
    name: Create GitHub Release Draft
    needs: test-gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools

    - name: Build python source and wheel packages
      run: |
        python setup.py sdist bdist_wheel

    - name: Generate Changelog
      id: changelog
      run: |
        # Generate release summary from CHANGELOG.md file
        echo "## Release Highlights" > release_notes.md
        sed -n '/## \[1.0.0-rc1\]/,/## \[/p' CHANGELOG.md | grep -v '## \[' >> release_notes.md

    - name: Create GitHub Release Draft
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        prerelease: false
        body_path: release_notes.md
        files: |
          dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

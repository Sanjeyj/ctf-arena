name: Security Pipeline Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # Run nightly scans

jobs:
  sast_and_dependency:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pip-audit

    - name: Run Bandit (SAST)
      run: |
        # Scan code excluding venv and tests
        bandit -r app/ -x tests/ -f txt

    - name: Run pip-audit (Vulnerability check)
      run: |
        pip-audit -r requirements.txt

    - name: Run Safety check (Dependency check)
      run: |
        # Safety database check (ignore if key needed or fail on criticals)
        safety check --full-report || true

  container_scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build local Docker image for scanning
      run: |
        docker build -t ctf-arena-local:latest .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ctf-arena-local:latest'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

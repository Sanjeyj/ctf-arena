<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Capability Registry</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #e0e6f0; margin: 0; padding: 20px; }
        h1 { color: #3b82f6; border-bottom: 2px solid #3b82f633; padding-bottom: 10px; }
        .nav-links a { color: #3b82f6; text-decoration: none; font-weight: bold; margin-right: 18px; font-size: 14px; }
        .nav-links a:hover { color: #93c5fd; }
        .info-box { background: #111827; border: 1px solid #1d4ed8; border-radius: 8px; padding: 15px; margin: 15px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #1e3a8a; text-align: left; }
        th { background: #172554; color: #93c5fd; }
        tr:nth-child(even) { background: #0f172a; }
    </style>
</head>
<body>
    <h1>📋 Capability Registry</h1>
    <div class="info-box">
        <p>Canonical registry of active cyber defense platform capabilities.</p>
        <div class="nav-links">
            <a href="/admin/mission-control">← Mission Control</a>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>Key</th>
                <th>Name</th>
                <th>Phase</th>
                <th>Category</th>
                <th>Maturity</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="6">Loading capabilities...</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

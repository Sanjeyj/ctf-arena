<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release Baselines & Gates</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #e0e6f0; margin: 0; padding: 20px; }
        h1 { color: #ec4899; border-bottom: 2px solid #ec489933; padding-bottom: 10px; }
        .nav-links a { color: #ec4899; text-decoration: none; font-weight: bold; margin-right: 18px; font-size: 14px; }
        .nav-links a:hover { color: #f472b6; }
        .info-box { background: #111827; border: 1px solid #9d174d; border-radius: 8px; padding: 15px; margin: 15px 0; }
        .gate-status { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .pass { background: #064e3b; color: #34d399; }
        .fail { background: #7f1d1d; color: #fca5a5; }
    </style>
</head>
<body>
    <h1>📦 Release Baselines & Gates</h1>
    <div class="info-box">
        <p>Immutable snapshots of platform state. Release gating requires manual human approval.</p>
        <div class="nav-links">
            <a href="/admin/mission-control">← Mission Control</a>
        </div>
    </div>
    <h2>Release Gate Status</h2>
    <div>
        <p>Test Gate: <span class="gate-status pass">PASS</span></p>
        <p>Security Gate: <span class="gate-status pass">PASS</span></p>
        <p>Tenant Isolation Gate: <span class="gate-status pass">PASS</span></p>
    </div>
</body>
</html>

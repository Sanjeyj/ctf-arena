<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CERT Teams Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #e0e6f0; margin: 0; padding: 20px; }
        h1 { color: #22d3ee; border-bottom: 2px solid #22d3ee33; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 20px; }
        .card { background: #111827; border: 1px solid #1e3a5f; border-radius: 10px; padding: 16px; }
        .card h3 { color: #22d3ee; margin: 0 0 10px; }
        .bar-wrap { margin: 6px 0; }
        .bar-label { font-size: 12px; color: #94a3b8; margin-bottom: 2px; }
        .bar { height: 8px; border-radius: 4px; background: #1e293b; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #22d3ee); border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🛡 National CERT Teams</h1>
    <div class="grid">
        {% for cert in certs %}
        <div class="card">
            <h3>{{ cert.country }}</h3>
            <div class="bar-wrap">
                <div class="bar-label">Capability: {{ (cert.capability * 100)|round(0)|int }}%</div>
                <div class="bar"><div class="bar-fill" style="width:{{ (cert.capability * 100)|round(0)|int }}%"></div></div>
            </div>
            <div class="bar-wrap">
                <div class="bar-label">Readiness: {{ (cert.readiness * 100)|round(0)|int }}%</div>
                <div class="bar"><div class="bar-fill" style="width:{{ (cert.readiness * 100)|round(0)|int }}%"></div></div>
            </div>
            <div class="bar-wrap">
                <div class="bar-label">Trust Score: {{ (cert.trust_score * 100)|round(0)|int }}%</div>
                <div class="bar"><div class="bar-fill" style="width:{{ (cert.trust_score * 100)|round(0)|int }}%"></div></div>
            </div>
        </div>
        {% else %}
        <div class="card"><p style="color:#64748b">No CERT teams registered.</p></div>
        {% endfor %}
    </div>
</body>
</html>

{% extends "base.html" %}
{% block title %}401 Unauthorized | CTF Arena | EthicBids Technologies™{% endblock %}
{% block content %}
<style>
.error-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; text-align: center; gap: 1.5rem; }
.error-code { font-family: 'Fira Code', monospace; font-size: 6rem; font-weight: 700; background: linear-gradient(135deg, var(--neon-red), #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
.error-title { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
.error-desc { font-size: 1rem; color: var(--text-secondary); max-width: 400px; line-height: 1.7; }
.error-icon { font-size: 4rem; }
</style>
<div class="error-page" id="error-401-page">
    <div class="error-icon">🔒</div>
    <div class="error-code">401</div>
    <div class="error-title">Authentication Required</div>
    <div class="error-desc">You must be logged in to access this resource. Please sign in with your credentials.</div>
    <a href="/login" class="submit-btn" id="btn-goto-login" style="text-decoration: none; padding: 0.75rem 2rem;">Go to Login</a>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to the Arena | CTF Arena | EthicBids Technologies™</title>
    <meta name="author" content="EthicBids Technologies">
    <meta name="application-name" content="CTF Arena">
    <meta name="copyright" content="© 2026 EthicBids Technologies™">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ui-modernization.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body class="ui-app-bg">
    <div class="ui-auth-card">
        <div class="ui-auth-logo">
            <span class="icon">🔑</span>
            <h1>Login <span>Arena<span class="ui-cursor">_</span></span></h1>
            <p>Access your challenges and statistics</p>
        </div>

        {% if error %}
            <div class="ui-error-msg" role="alert">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" id="login-form">
            <!-- CSRF Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="ui-form-group">
                <label for="login-username" class="ui-label">Username</label>
                <input type="text" name="username" id="login-username" class="ui-input" placeholder="e.g. HackerAce42" required autocomplete="off" autofocus>
            </div>
            
            <div class="ui-form-group">
                <label for="login-password" class="ui-label">Password</label>
                <input type="password" name="password" id="login-password" class="ui-input" placeholder="••••••••••" required>
            </div>

            <div class="ui-form-group">
                <label class="ui-checkbox-row" for="login-remember">
                    <input type="checkbox" name="remember" id="login-remember">
                    Remember Me
                </label>
            </div>

            <button type="submit" class="ui-submit-btn" id="btn-login-submit">Sign In →</button>
        </form>

        <div class="ui-auth-link">
            New player? <a href="/register" id="link-register">Register Display Name →</a><br><br>
            Organiser? <a href="/admin/login" id="link-admin-login">Admin Login →</a>
        </div>
    </div>
    <p style="margin-top:1.5rem;font-size:0.72rem;color:rgba(255,255,255,0.35);text-align:center;letter-spacing:0.3px;">Powered by <a href="https://ethicbids.vercel.app/" target="_blank" rel="noopener" style="color:rgba(0,240,255,0.5);text-decoration:none;">EthicBids Technologies™</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assurance Cases Claims</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0f1e; color: #e0e6f0; margin: 0; padding: 20px; }
        h1 { color: #f59e0b; border-bottom: 2px solid #f59e0b33; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
        .card { background: #111827; border: 1px solid #78350f; border-radius: 10px; padding: 18px; }
        .card h3 { color: #f59e0b; margin: 0 0 8px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .supported { background: #052e16; color: #34d399; }
        .under_review { background: #1e3a5f; color: #60a5fa; }
        .insufficient_evidence { background: #450a0a; color: #f87171; }
        .stat { margin: 6px 0; font-size: 14px; color: #94a3b8; }
        .stat span { color: #e0e6f0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📂 Assurance Cases Claims & Confidence Gaps</h1>
    <div class="grid">
        {% for c in cases %}
        <div class="card">
            <h3>{{ c.title }}</h3>
            <span class="badge {{ c.status }}">{{ c.status.upper() }}</span>
            <div class="stat">Scope: <span>{{ c.scope or 'Overall Platform' }}</span></div>
            <div class="stat">Owner: <span>{{ c.owner or '—' }}</span></div>
            <div class="stat">Confidence score: <span>{{ c.confidence_score }}%</span></div>
            <div class="stat">Claim: <div style="color:#d1d5db; margin-top: 4px;">{{ c.claim }}</div></div>
        </div>
        {% else %}
        <div class="card"><p style="color:#64748b">No active claims cataloged.</p></div>
        {% endfor %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Access — CTF Arena | EthicBids Technologies™</title>
    <meta name="description" content="CTF Arena Administrator login — restricted access">
    <meta name="author" content="EthicBids Technologies">
    <meta name="application-name" content="CTF Arena">
    <meta name="copyright" content="© 2026 EthicBids Technologies™">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/axiom.css">
</head>
<body class="ax-auth-shell">
    <div class="ax-auth-card">

        <!-- Brand -->
        <div class="ax-auth-brand" style="cursor:default;">
            <div class="ax-auth-brand-mark" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 3v18m0-9h18"/>
                </svg>
            </div>
            <span class="ax-auth-brand-name">CTF Arena <span>· Admin</span></span>
        </div>

        <!-- Classification banner -->
        <div class="ax-auth-classification" role="status" aria-label="Restricted access">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
            </svg>
            Restricted access — Authorised personnel only
        </div>

        <!-- Header -->
        <div class="ax-auth-header">
            <div style="display:none;">Admin <span>Portal</span></div>
            <h1 class="ax-auth-title">Administrator sign in</h1>
            <p class="ax-auth-subtitle">Access the CTF Arena control panel. All sessions are logged.</p>
        </div>

        <!-- Error message -->
        {% if error %}
        <div class="ax-alert ax-alert-error" role="alert" aria-live="polite">
            <svg class="ax-alert-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="/admin/login" id="admin-login-form" class="ax-auth-form" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="ax-form-group">
                <label for="admin-username" class="ax-label">Username</label>
                <div class="ax-input-group">
                    <svg class="ax-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                    </svg>
                    <input type="text"
                           name="username"
                           id="admin-username"
                           class="ax-input"
                           placeholder="Administrator username"
                           required
                           autocomplete="username"
                           autofocus
                           spellcheck="false"
                           aria-required="true">
                </div>
            </div>

            <div class="ax-form-group">
                <label for="admin-password" class="ax-label">Password</label>
                <div class="ax-input-group">
                    <svg class="ax-input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                    </svg>
                    <input type="password"
                           name="password"
                           id="admin-password"
                           class="ax-input"
                           placeholder="••••••••"
                           required
                           autocomplete="current-password"
                           aria-required="true">
                </div>
            </div>

            <button type="submit" class="ax-btn ax-btn-primary ax-btn-lg ax-auth-submit" id="btn-admin-login">
                Access control panel
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width:16px;height:16px;" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
                </svg>
            </button>
        </form>

        <!-- Footer links -->
        <div class="ax-auth-divider"></div>
        <div class="ax-auth-links">
            <span><a href="/login" id="link-back-register">← Return to participant sign in</a></span>
        </div>

        <div class="ax-auth-footer">
            <a href="https://ethicbids.vercel.app/" target="_blank" rel="noopener noreferrer">EthicBids Technologies™</a> · © 2026 · All sessions logged
        </div>

    </div>
</body>
</html>

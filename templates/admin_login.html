<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CTF Arena | EthicBids Technologies™</title>
    <meta name="author" content="EthicBids Technologies">
    <meta name="application-name" content="CTF Arena">
    <meta name="copyright" content="© 2026 EthicBids Technologies™">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/ui-modernization.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body class="ui-app-bg">
    <div class="ui-auth-card">
        <div class="ui-auth-logo">
            <span class="icon">🛡️</span>
            <h1>Admin <span>Portal</span><span class="ui-cursor">_</span></h1>
            <p>CTF Arena — Organiser Access</p>
        </div>

        {% if error %}
            <div class="ui-error-msg" role="alert">🔒 {{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login" id="admin-login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="ui-form-group">
                <label for="admin-username" class="ui-label">Username</label>
                <input type="text" name="username" id="admin-username" class="ui-input" placeholder="admin" required autocomplete="off" autofocus>
            </div>
            
            <div class="ui-form-group">
                <label for="admin-password" class="ui-label">Password</label>
                <input type="password" name="password" id="admin-password" class="ui-input" placeholder="••••••••••" required>
            </div>

            <button type="submit" class="ui-submit-btn" id="btn-admin-login">Login to Dashboard →</button>
        </form>

        <div class="ui-auth-link">
            <a href="/register" id="link-back-register">← Back to Participant Login</a>
        </div>
    </div>
    <p style="margin-top:1.5rem;font-size:0.72rem;color:rgba(255,255,255,0.35);text-align:center;letter-spacing:0.3px;">Powered by <a href="https://ethicbids.vercel.app/" target="_blank" rel="noopener" style="color:rgba(0,240,255,0.5);text-decoration:none;">EthicBids Technologies™</a></p>
</body>
</html>
